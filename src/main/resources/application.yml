server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: productos-ms

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:productos_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:productos_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'validate': el schema ya lo crea pedidos360-db-ms (init-scripts). Este ms
      # NUNCA debe crear/alterar tablas por si solo.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:4200}

logging:
  level:
    org.springframework.security: INFO

---

spring:
  config:
    activate:
      on-profile: "!local"

azure:
  client-id: ${AZURE_CLIENT_ID}
  audience: ${AZURE_API_AUDIENCE:api://${AZURE_CLIENT_ID}}

